<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deen</title>
<style>
:root{--bg:#f6fafc;--card:#ffffff;--ink:#12303f;--mut:#6a8392;--pri:#1d6a8f;--pri2:#e4eff5;--line:#e3ebf0;--gold:#2e8ab3;--gold2:#e4eff5;--hero1:#14597a;--hero2:#2b8bb5;--hl:#bfe3f5;--tile:#f1f4f6}
@media (prefers-color-scheme:dark){:root{--bg:#08141b;--card:#0f222d;--ink:#e8f3f9;--mut:#8aa6b5;--pri:#4fb2dc;--pri2:#16313f;--line:#1d3b4b;--gold:#7cc4e4;--gold2:#16313f;--hero1:#0c3a50;--hero2:#14597a;--hl:#bfe3f5;--tile:#16313f}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans Bengali","Kalpurush","Siyam Rupali",system-ui,sans-serif;font-size:14px;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.ar{font-family:"Noto Naskh Arabic","Amiri","Scheherazade New","Traditional Arabic",serif;direction:rtl;line-height:2.1}
main{flex:1;overflow-y:auto;padding:10px 14px 20px}
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));gap:4px}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:8px 2px;font:inherit;font-size:12px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:20px}
nav button.on{color:var(--pri);background:var(--pri2);font-weight:700}
.sec{display:none}.sec.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{border:0;border-radius:10px;padding:8px 13px;background:var(--pri2);color:var(--pri);font:inherit;font-size:13px;font-weight:600}
.btn.p{background:var(--pri);color:#fff}.btn.d{background:transparent;color:#c0392b}
.mut{color:var(--mut);font-size:12px}

/* HOME */
.hnext{border-radius:22px;padding:14px;color:#fff;background:linear-gradient(160deg,var(--hero1),var(--hero2));display:flex;justify-content:space-between;align-items:center;gap:10px}
.hnext small{opacity:.85;font-size:12px;display:block}
.hnext b{font-size:18px;color:var(--hl)}
.hnext .hc{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:16px}
.tile{border:0;background:none;color:var(--ink);font:inherit;font-size:14px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0}
.tile .ic{width:100%;max-width:120px;aspect-ratio:1;border-radius:28%;background:var(--tile);display:flex;align-items:center;justify-content:center;font-size:44px}
.tile:active .ic{transform:scale(.96)}
@media(min-width:380px){.grid{grid-template-columns:repeat(3,1fr)}}

/* TIME */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:16px 14px 18px;color:#fff;text-align:center;background:linear-gradient(160deg,var(--hero1),var(--hero2))}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 0,#ffffff22,transparent 55%);pointer-events:none}
.hero>*{position:relative}
.hdate{display:flex;justify-content:space-between;font-size:13px;opacity:.9}
.curname{margin-top:10px;font-size:14px;opacity:.9}
.curname b{color:var(--hl);font-size:18px}
.ringwrap{position:relative;width:min(78vw,300px);margin:8px auto 0}
.ringwrap svg{width:100%;display:block;transform:rotate(-90deg)}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringtxt small{font-size:13px;opacity:.85}
.ringtxt .cd{font-size:clamp(30px,10vw,44px);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:1px;margin:2px 0}
.ringtxt .nx{color:var(--hl);font-weight:700;font-size:16px}
.clock{font-size:clamp(40px,14vw,60px);font-weight:700;line-height:1.1;margin-top:10px;font-variant-numeric:tabular-nums}
.clock small{font-size:.35em;font-weight:600;margin-left:4px;color:var(--hl)}
.sehri{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.sehri div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.sehri small{color:var(--mut);display:block}.sehri b{font-size:18px;color:var(--gold)}
.plist .pr{display:flex;align-items:center;gap:10px;padding:11px 10px;border-radius:12px;font-size:15px}
.plist .pr .dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.plist .pr span.t{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--mut)}
.plist .pr.on{background:var(--pri);color:#fff;font-weight:700}
.plist .pr.on .dot{background:var(--hl)}.plist .pr.on span.t{color:#fff}
.plist .pr.past{opacity:.55}

/* INPUT/MODAL */
#modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:9}
#modal.on{display:flex}
#sheet{background:var(--card);width:100%;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto}
#sheet h2{margin:0 0 10px;font-size:17px}
input,textarea{width:100%;padding:10px;margin:5px 0;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:15px}
.trow{display:flex;align-items:center;gap:10px}.trow label{width:70px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
#toast.on{opacity:1}

/* corner ornaments */
main{overflow-x:hidden}
.corner{position:absolute;top:-10px;width:96px;height:96px;color:var(--pri);pointer-events:none}
.corner.l{left:-14px}.corner.r{right:-14px;transform:scaleX(-1)}
#s-tasbih{position:relative}
.ttop{display:flex;justify-content:space-between;align-items:center;padding:8px 6px 14px;position:relative}
.ttop button{border:0;background:none;color:var(--pri);padding:4px}
.ttop svg{width:30px;height:30px;display:block}
.datepill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:8px 14px;background:var(--hero1);color:#fff;font-size:13px;font-weight:600}
.datepill svg,.pill svg{width:16px;height:16px}
.tapwrap{position:relative;display:flex;justify-content:center;align-items:center;margin:52px 0 46px}
.orn{position:absolute;top:50%;margin-top:-20px;width:84px;height:40px;color:var(--pri);opacity:.7}
.orn.a{left:0}.orn.b{right:0;transform:scaleX(-1)}
.tap svg{width:52%;height:52%}
.tools2 svg{width:22px;height:22px;display:block;margin:auto;color:var(--pri)}
.tools2 .sv{display:flex;align-items:center;gap:6px}.tools2 .sv svg{width:18px;height:18px;color:#fff;fill:#fff;margin:0}
nav{margin:4px 12px calc(10px + env(safe-area-inset-bottom,0px));border-radius:28px;box-shadow:0 8px 22px #1d6a8f22;border:1px solid var(--line);padding:6px}
nav button{color:var(--pri);font-weight:600}
nav button svg{width:26px;height:26px;fill:currentColor;display:block}
nav button.on{background:var(--pri2)}
.tile .ic svg{width:54%;height:54%;fill:var(--pri)}
/* TASBIH */
.tb{display:flex;justify-content:flex-end;gap:4px;margin:0 0 6px}
.tb button{border:0;background:none;color:var(--ink);font-size:20px;padding:4px 9px}
.tcard{position:relative;overflow:hidden;border-radius:26px;border:1px solid var(--line);padding:14px 14px 72px;text-align:center;min-height:420px;background:linear-gradient(180deg,var(--card),var(--pri2));box-shadow:0 6px 22px #1d6a8f14}
.tcard>svg.bg{position:absolute;left:0;right:0;bottom:0;width:100%;height:100%;pointer-events:none}
.tcard>*:not(svg.bg){position:relative}
.pillrow{display:flex;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:99px;padding:9px 16px;font:inherit;font-size:12px;font-weight:600;background:var(--pri2);color:var(--pri)}
.pill.solid{background:var(--pri);color:#fff}
.pills{display:flex;justify-content:center;gap:8px;margin-top:6px}
.cnt{font-size:76px;font-weight:800;line-height:1.1;margin:58px 0 6px;color:var(--hero1)}
.bar{height:5px;width:96px;background:var(--line);border-radius:9px;overflow:hidden;margin:0 auto}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--gold));width:0;transition:width .15s}
.zsel{margin-top:14px;border:1px solid var(--line);border-radius:99px;padding:11px 28px;background:var(--pri2);color:var(--hero1);font:inherit;font-size:18px;font-weight:700}
.tools2{position:absolute!important;left:10px;right:10px;bottom:10px;display:flex;gap:8px;align-items:center}
.tools2 .sq{border:0;border-radius:14px;width:44px;height:46px;background:var(--card);color:var(--ink);font-size:17px;box-shadow:0 2px 8px #0002}
.tools2 .sq.off{opacity:.35}
.tools2 .sv{margin-left:auto;border:0;border-radius:14px;height:46px;padding:0 16px;background:linear-gradient(160deg,var(--hero1),var(--hero2));color:#fff;font:inherit;font-size:15px;font-weight:700}
.tap{width:min(32vw,124px);aspect-ratio:1;border-radius:50%;border:0;margin:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,var(--hero2),var(--hero1));color:#fff;touch-action:manipulation;user-select:none;box-shadow:0 0 0 9px color-mix(in srgb,var(--pri) 38%,var(--card)),0 0 0 24px color-mix(in srgb,var(--pri) 18%,var(--card)),0 0 0 38px color-mix(in srgb,var(--pri) 9%,var(--card))}
.tap:active{transform:scale(.96)}
.hint{text-align:center;color:var(--pri);font-size:14px;margin:4px 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat b{display:block;font-size:24px;color:var(--pri)}.stat small{color:var(--mut)}
.item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.item:last-child{border:0}
.seg{display:flex;background:var(--pri2);border-radius:10px;padding:3px;margin:8px 0}
.seg button{flex:1;border:0;background:none;padding:7px;border-radius:8px;font:inherit;font-size:12px;color:var(--pri)}
.seg button.on{background:var(--pri);color:#fff}
.dua h3{margin:0 0 4px;font-size:15px;color:var(--pri)}.dua .ar{font-size:22px;margin:6px 0}.dua p{margin:4px 0;color:var(--mut);font-size:13px}
details.dua summary{cursor:pointer;list-style:none;color:var(--pri);font-size:15px}
details.dua[open] summary{margin-bottom:6px}

/* NEW HOME */
#s-home{position:relative;padding-bottom:6px}
#s-home .corner{top:-10px}
.htop{display:flex;justify-content:space-between;align-items:center;padding:8px 6px 0;position:relative;z-index:2}
.htop button{border:0;background:none;color:var(--pri);padding:4px}
.htop svg{width:32px;height:32px;display:block}
.harch{display:block;width:92%;margin:-16px auto 0;position:relative;z-index:1}
.ncard{position:relative;z-index:2;margin:-76px 4px 0;border-radius:30px;padding:34px 18px 26px;text-align:center;background:linear-gradient(180deg,var(--card),var(--pri2));border:1.5px solid color-mix(in srgb,var(--pri) 25%,var(--card));box-shadow:0 10px 28px #1d6a8f22}
.nbadge{position:absolute;left:50%;top:-30px;transform:translateX(-50%);width:62px;height:62px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;box-shadow:0 -2px 0 color-mix(in srgb,var(--pri) 22%,var(--card))}
.nbadge svg{width:38px;height:38px}
.norn{display:flex;align-items:center;gap:8px;margin:-6px 6px 12px;color:var(--pri)}
.norn i,.ft i{flex:1;height:1.5px;background:linear-gradient(90deg,transparent,var(--pri));opacity:.55}
.norn i:last-child,.ft i:last-child{background:linear-gradient(270deg,transparent,var(--pri))}
.norn svg,.ft svg{width:14px;height:14px;fill:var(--pri)}
.norn span{width:60px}.norn span{display:none}
.ntitle{font-family:system-ui,"Segoe UI",Roboto,sans-serif;font-size:27px;font-weight:500;color:var(--pri);letter-spacing:.3px}
.npill{margin:14px 14px 0;border-radius:99px;padding:14px 10px;background:color-mix(in srgb,var(--pri) 9%,var(--card));box-shadow:inset 0 2px 8px #1d6a8f14}
.npill span{font-family:system-ui,"Segoe UI",Roboto,sans-serif;font-size:40px;font-weight:700;color:var(--pri);letter-spacing:3px;font-variant-numeric:tabular-nums;line-height:1.1}
.nname{margin-top:10px;font-size:13px;color:var(--mut);min-height:18px}
.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
.htile{border:1px solid color-mix(in srgb,var(--pri) 18%,var(--card));border-radius:24px;background:linear-gradient(180deg,var(--card),var(--pri2));box-shadow:0 6px 18px #1d6a8f18;padding:16px 4px 12px;color:var(--pri);font:inherit;display:flex;flex-direction:column;align-items:center;gap:6px}
.htile:active{transform:scale(.97)}
.htile .hi{width:70px;height:70px}
.htile b{font-size:20px;font-weight:600;color:var(--pri);margin-top:4px}
.htile .ft{display:flex;align-items:center;gap:4px;width:80%;margin-top:8px}
</style>
</head>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const bn=n=>String(n).replace(/\d/g,d=>"০১২৩৪৫৬৭৮৯"[d]);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KEY="deen_v2";
const DEF={
 topics:[{id:"t1",name:"সুবহানাল্লাহ",target:33},{id:"t2",name:"আলহামদুলিল্লাহ",target:33},{id:"t3",name:"আল্লাহু আকবার",target:34},{id:"t4",name:"লা ইলাহা ইল্লাল্লাহ",target:100},{id:"t5",name:"আস্তাগফিরুল্লাহ",target:100}],
 sel:"t1",counts:{},logs:[],duas:[],
 times:["04:39","11:41","15:48","17:26","18:41"]
};
let S;
try{S=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){S=null}
if(!S)S=JSON.parse(JSON.stringify(DEF));
if(!S.times)S.times=DEF.times.slice();
if(!S.surahs)S.surahs=[];
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fmtDay=k=>{const [y,m,d]=k.split("-");return bn(d)+"/"+bn(m)+"/"+bn(y)};
const fmt12=(h,m)=>{const ap=h>=12?"PM":"AM";h=h%12||12;return bn(h)+":"+bn(String(m).padStart(2,"0"))+" "+ap};
const fmtTime=t=>{const d=new Date(t);return fmt12(d.getHours(),d.getMinutes())};
let toastT;const toast=m=>{const e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove("on"),1800)};
function openSheet(html){$("#sheet").innerHTML=html;$("#modal").classList.add("on")}
function closeSheet(){$("#modal").classList.remove("on")}
$("#modal").onclick=e=>{if(e.target.id==="modal")closeSheet()};

/* ===== TIME ===== */
const PN=["ফজর","যোহর","আসর","মাগরিব","এশা"];
const at=(hm,off)=>{const [h,m]=hm.split(":").map(Number);const d=new Date();d.setDate(d.getDate()+off);d.setHours(h,m,0,0);return d};
const pad=n=>String(n).padStart(2,"0");
function tickTime(){
  const now=new Date(),C=2*Math.PI*112;
  // build timeline: yesterday isha, today 5, tomorrow fajr
  const tl=[{n:4,t:at(S.times[4],-1)},...S.times.map((x,i)=>({n:i,t:at(x,0)})),{n:0,t:at(S.times[0],1)}];
  let k=0;for(let i=0;i<tl.length-1;i++){if(now>=tl[i].t&&now<tl[i+1].t){k=i;break}}
  const a=tl[k],b=tl[k+1];
  const left=Math.max(0,b.t-now),tot=b.t-a.t;
  const hh=Math.floor(left/3600000),mm=Math.floor(left%3600000/60000),ss=Math.floor(left%60000/1000);
  $("#cd").textContent=bn(pad(hh)+":"+pad(mm)+":"+pad(ss));

/* ===== FX ===== */
const vib=p=>{if(S.vib===false)return;try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
let AC;
function beep(f,d,v){
  if(S.sound===false)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type="sine";o.frequency.value=f;
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);}catch(e){}
}
function tik(){
  if(S.sound===false)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
    const t=AC.currentTime,len=Math.floor(AC.sampleRate*0.03);
    const buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,6);
    const src=AC.createBufferSource();src.buffer=buf;
    const f=AC.createBiquadFilter();f.type="bandpass";f.frequency.value=3200;f.Q.value=1.2;
    const g=AC.createGain();g.gain.value=1.6;src.connect(f);f.connect(g);g.connect(AC.destination);src.start(t);
    const o=AC.createOscillator(),og=AC.createGain();o.type="square";o.frequency.value=2200;
    og.gain.setValueAtTime(0.25,t);og.gain.exponentialRampToValueAtTime(0.001,t+0.025);o.connect(og);og.connect(AC.destination);o.start(t);o.stop(t+0.03);}catch(e){}
}
const clickFx=()=>{vib(70);tik()};
const doneFx=()=>{vib([80,50,80,50,160]);beep(660,0.15,0.4);setTimeout(()=>beep(990,0.25,0.4),160)};

  openSheet(`<h2>নিজের সূরা যোগ করুন</h2><input id="sN" placeholder="সূরার নাম"><textarea id="sA" class="ar" rows="5" placeholder="আরবি"></textarea><textarea id="sB" rows="3" placeholder="উচ্চারণ/অর্থ (ঐচ্ছিক)"></textarea>
  <div class="row" style="margin-top:8px"><button class="btn" onclick="closeSheet()">বাতিল</button><button class="btn p" id="okS">সেভ</button></div>`);
  $("#okS").onclick=()=>{const n=$("#sN").value.trim();if(!n)return toast("সূরার নাম লিখুন");S.surahs.push({id:"s"+Date.now(),n,ar:$("#sA").value.trim(),bn:$("#sB").value.trim()});persist();closeSheet();renderSurahs()};
};

/* ===== NAV / FX ===== */
$$("nav button").forEach(b=>b.onclick=()=>{
  $$("nav button").forEach(x=>x.classList.toggle("on",x===b));
  $$(".sec").forEach(s=>s.classList.toggle("on",s.id==="s-"+b.dataset.t));
  $("main").scrollTop=0;
});
function renderFx(){$("#tSound").classList.toggle("off",S.sound===false);$("#tVib").classList.toggle("off",S.vib===false)}
$("#tSound").onclick=()=>{S.sound=S.sound===false;persist();renderFx();if(S.sound)tik()};
$("#tVib").onclick=()=>{S.vib=S.vib===false;persist();renderFx();if(S.vib)vib(40)};
$$("[data-go]").forEach(b=>b.onclick=()=>$(`nav button[data-t="${b.dataset.go}"]`).click());
renderSurahs();renderFx();renderCounter();renderDuas();renderPlist();tickTime();setInterval(tickTime,1000);
</script>
</body>
